services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-counterai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-counterai}
      POSTGRES_DB: ${POSTGRES_DB:-counterai_production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-counterai} -d ${POSTGRES_DB:-counterai_production}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-counterai}:${POSTGRES_PASSWORD:-counterai}@db:5432/${POSTGRES_DB:-counterai_production}
      RAILS_ENV: production
      PORT: "80"
      SOLID_QUEUE_IN_PUMA: ${SOLID_QUEUE_IN_PUMA:-true}
      RAILS_LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/rails/storage/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "8080:80"

  caddy:
    profiles:
      - tls
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_HOST: ${API_HOST:?set API_HOST in .env when using tls profile}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres-data:
  uploads:
  caddy-data:
  caddy-config:
