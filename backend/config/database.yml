# PostgreSQL for all environments.
# Heroku sets DATABASE_URL; Solid Cache/Queue/Cable share that DB unless you set *_DATABASE_URL.
#
# Local dev: install Postgres, set PGUSER/PGPASSWORD (see repo-root .env.example), then:
#   bin/rails db:create db:migrate
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

# Local TCP auth — set PGPASSWORD to match your postgres role (no default; avoids wrong guesses).
local: &local
  host: <%= ENV.fetch("PGHOST", "localhost") %>
  username: <%= ENV.fetch("PGUSER", "postgres") %>
  password: <%= ENV["PGPASSWORD"] %>

development:
  primary:
    <<: *default
    <<: *local
    database: backend_development
  queue:
    <<: *default
    <<: *local
    database: backend_development_queue
    migrations_paths: db/queue_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    <% if ENV["DATABASE_URL"] %>
    url: <%= ENV["DATABASE_URL"] %>
    <% else %>
    <<: *local
    database: backend_test
    <% end %>
  queue:
    <<: *default
    migrations_paths: db/queue_migrate
    <% if ENV["DATABASE_URL"] %>
    url: <%= ENV["QUEUE_DATABASE_URL"].presence || ENV["DATABASE_URL"] %>
    <% else %>
    <<: *local
    database: backend_test_queue
    <% end %>

production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *default
    migrations_paths: db/cache_migrate
    url: <%= ENV["CACHE_DATABASE_URL"].presence || ENV["DATABASE_URL"] %>
  queue:
    <<: *default
    migrations_paths: db/queue_migrate
    url: <%= ENV["QUEUE_DATABASE_URL"].presence || ENV["DATABASE_URL"] %>
  cable:
    <<: *default
    migrations_paths: db/cable_migrate
    url: <%= ENV["CABLE_DATABASE_URL"].presence || ENV["DATABASE_URL"] %>
