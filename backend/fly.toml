# fly.toml app configuration file generated for counteraibackend on 2026-04-17T21:31:28-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'counteraibackend'
primary_region = 'yyz'
console_command = '/rails/bin/rails console'

[build]
  build-target = "fly"

[env]
  # All SQLite DB files must live under /litefs (LiteFS allows only the mount root).
  DATABASE_URL = 'sqlite3:///litefs/production.sqlite3'
  PRIMARY_REGION = 'yyz'
  PORT = '8080'
  SOLID_QUEUE_IN_PUMA = 'true'

[[mounts]]
  source = 'litefs'
  destination = '/var/lib/litefs'

[[mounts]]
  source = 'data'
  destination = '/rails/storage'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/up'
    protocol = 'http'
    tls_skip_verify = false

    [http_service.checks.headers]
      X-Forwarded-Proto = 'https'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
